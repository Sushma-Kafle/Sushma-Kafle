<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 55 1200 190" role="img" aria-label="Hello, World! animated red coral and golden aurora banner">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#54101F"/>
      <stop offset="46%" stop-color="#9E2030"/>
      <stop offset="100%" stop-color="#3B1129"/>
    </linearGradient>
    <linearGradient id="aurora1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E52B3D" stop-opacity="0"/>
      <stop offset="26%" stop-color="#FF6152" stop-opacity=".85"/>
      <stop offset="56%" stop-color="#FFB064" stop-opacity=".85"/>
      <stop offset="82%" stop-color="#FFD780" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#FFD780" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurora2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB25F" stop-opacity="0"/>
      <stop offset="35%" stop-color="#FFCC78" stop-opacity=".7"/>
      <stop offset="65%" stop-color="#F24948" stop-opacity=".65"/>
      <stop offset="100%" stop-color="#E42C3C" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="soft" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="8"/></filter>
    <radialGradient id="halo"><stop offset="0%" stop-color="#FFBD75" stop-opacity=".24"/><stop offset="100%" stop-color="#FFBD75" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#base)"/>
    <ellipse cx="600" cy="135" rx="480" ry="240" fill="url(#halo)">
      <animate attributeName="rx" values="420;530;420" dur="10s" repeatCount="indefinite"/>
    </ellipse>
    <g filter="url(#blur)">
      <path d="M-260 205 C 60 -30, 240 350, 530 145 S 960 40, 1450 200" fill="none" stroke="url(#aurora1)" stroke-width="110" opacity=".7">
        <animateTransform attributeName="transform" type="translate" values="-90 18;80 -24;-90 18" dur="13s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".5;.86;.5" dur="8s" repeatCount="indefinite"/>
      </path>
      <path d="M-280 105 C 90 330, 370 -90, 690 125 S 1120 315, 1470 75" fill="none" stroke="url(#aurora2)" stroke-width="90" opacity=".62">
        <animateTransform attributeName="transform" type="translate" values="110 -20;-100 22;110 -20" dur="17s" repeatCount="indefinite"/>
      </path>
    </g>
    <g filter="url(#soft)" opacity=".6">
      <path d="M-180 220 Q 180 45 410 190 T 890 135 T 1380 180" fill="none" stroke="url(#aurora1)" stroke-width="20">
        <animateTransform attributeName="transform" type="translate" values="-50 0;55 -12;-50 0" dur="11s" repeatCount="indefinite"/>
      </path>
      <path d="M-120 105 Q 200 255 490 100 T 1020 175 T 1380 95" fill="none" stroke="url(#aurora2)" stroke-width="16">
        <animateTransform attributeName="transform" type="translate" values="40 5;-45 20;40 5" dur="15s" repeatCount="indefinite"/>
      </path>
    </g>
    <g fill="#FFE2AC">
      <circle cx="165" cy="65" r="2" opacity=".6"><animate attributeName="opacity" values=".1;.75;.1" dur="4s" repeatCount="indefinite"/></circle>
      <circle cx="1000" cy="76" r="2.5" opacity=".5"><animate attributeName="opacity" values=".15;.9;.15" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="1055" cy="235" r="1.8" opacity=".5"><animate attributeName="opacity" values=".1;.8;.1" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="245" cy="245" r="2" opacity=".6"><animate attributeName="opacity" values=".15;.7;.15" dur="7s" repeatCount="indefinite"/></circle>
    </g>
    <text x="600" y="157" text-anchor="middle" dominant-baseline="middle" font-family="Verdana, DejaVu Sans, sans-serif" font-size="70" font-weight="700" letter-spacing="1" fill="#421324" opacity=".5" transform="translate(2 4)">Hello, World!</text>
    <text x="600" y="157" text-anchor="middle" dominant-baseline="middle" font-family="Verdana, DejaVu Sans, sans-serif" font-size="70" font-weight="700" letter-spacing="1" fill="#FFF5E8">Hello, World!</text>
    <text x="600" y="215" text-anchor="middle" font-family="Verdana, DejaVu Sans, sans-serif" font-size="19" letter-spacing="3" fill="#FFE3C2">DATA  •  CURIOSITY  •  INNOVATION</text>
  </g>
</svg>
